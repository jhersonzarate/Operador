spring.application.name=complytools-assistant
server.port=${PORT:8080}

# --- Base de datos PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- CORS ---
app.cors.allowed-origins=https://complytools.vercel.app

# --- JWT ---
app.jwt.secret=complytools-secret-key-2024-debe-tener-minimo-32-caracteres-para-hs256
app.jwt.expiration=86400000

# --- Logging ---
logging.level.com.complytools=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN