# =============================================================
# COMPLYTOOLS ASSISTANT - Configuracion principal
# =============================================================

spring.application.name=complytools-assistant
server.port=8080

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/complytools_db
spring.datasource.username=postgres
spring.datasource.password=tu_password_aqui
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=complytools-secret-key-2024-muy-larga-para-seguridad
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.complytools=INFO
logging.level.org.springframework.security=WARN