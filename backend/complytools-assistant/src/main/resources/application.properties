# =============================================================
# COMPLYTOOLS ASSISTANT - Configuracion principal
# =============================================================

spring.application.name=complytools-assistant
server.port=8080

# --- Base de datos PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/complytools_db
spring.datasource.username=postgres
spring.datasource.password=rrr100911
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173

# --- JWT (preparado para implementacion futura) ---
app.jwt.secret=complytools-secret-key-2024-debe-tener-minimo-32-caracteres-para-hs256
app.jwt.expiration=86400000

# --- Logging ---
logging.level.com.complytools=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN